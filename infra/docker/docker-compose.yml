# Local development infrastructure. The backend and frontend run on the host (IDE / ng serve).
# Usage (from repo root):  docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up -d
name: shiftgrab-dev

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shiftgrab}
      POSTGRES_USER: ${DB_USER:-shiftgrab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftgrab}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # start-dev: HTTP, embedded dev database, realm imported from infra/keycloak on every start
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    volumes:
      - ../keycloak/realm-shiftgrab.json:/opt/keycloak/data/import/realm-shiftgrab.json:ro
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web UI: http://localhost:8025

volumes:
  postgres-data:
  redis-data:

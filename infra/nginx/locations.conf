# Routes of the public site, shared by the HTTP and HTTPS server blocks (SG-71). One origin for everything, so
# the browser needs no CORS and cookies/tokens stay first-party.
client_max_body_size 1m;

# REST API, load-balanced over both backends. nginx never retries a non-idempotent request (a claim) on the other
# instance, so a slow claim cannot be executed twice.
location /api/ {
    proxy_pass http://shiftgrab_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    include /etc/nginx/shiftgrab/proxy-headers.conf;
    proxy_read_timeout 30s;
}

# Live slot updates (SG-40): long-lived WebSocket connections.
location /ws {
    proxy_pass http://shiftgrab_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/shiftgrab/proxy-headers.conf;
    proxy_read_timeout 1h;
}

# Keycloak's login form posts (SG-92): rate-limited per address, see upstreams.conf. A regex location wins over the
# /auth/ prefix below, so only these requests are limited.
location ~ ^/auth/realms/[^/]+/login-actions/ {
    limit_req zone=login burst=20 nodelay;
    proxy_pass http://keycloak:8080;
    include /etc/nginx/shiftgrab/proxy-headers.conf;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

# Keycloak login pages and OIDC endpoints. Its headers can be large (tokens in redirects).
location /auth/ {
    proxy_pass http://keycloak:8080;
    include /etc/nginx/shiftgrab/proxy-headers.conf;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

# Grafana dashboards (SG-72); login required unless read-only anonymous access is switched on.
location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/shiftgrab/proxy-headers.conf;
}

# Actuator and the Keycloak admin console stay internal (Prometheus scrapes the backends on the private network).
location /actuator/ {
    return 404;
}
location /auth/admin/ {
    return 404;
}

# Everything else is the web app.
location / {
    proxy_pass http://frontend:8080;
    include /etc/nginx/shiftgrab/proxy-headers.conf;
}

# Edge proxy, http context (SG-71). Two backend instances behind one name: least_conn sends each request to the
# instance with fewer active connections; an instance failing 3 times is skipped for 10 s.
upstream shiftgrab_backend {
    least_conn;
    server backend-1:8080 max_fails=3 fail_timeout=10s;
    server backend-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Login form submissions per client address (SG-92). Keycloak locks one ACCOUNT after 5 failures; this limits one
# ADDRESS trying many accounts (credential stuffing). Only POSTs count (an empty key is not limited), and the rate
# leaves room for a team logging in together behind one shared Wi-Fi address.
map $request_method $login_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_post_key zone=login:10m rate=30r/m;
limit_req_status 429;

# WebSocket upgrade for /ws (SG-40): keep "upgrade" when the client asks for it, otherwise close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

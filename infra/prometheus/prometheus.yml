# Prometheus (SG-72): pulls metrics from both backends every 15 s over the private Compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shiftgrab-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-1:8080", "backend-2:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

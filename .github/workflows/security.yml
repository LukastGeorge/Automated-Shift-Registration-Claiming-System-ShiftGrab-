name: Security

# SG-73: static analysis of the code (CodeQL) and of the containers (Trivy) on every PR and push, plus a weekly
# run so newly published vulnerabilities are found even when nobody touches the code.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Trivy CLI from a pinned image rather than a third-party action: a pinned image cannot be swapped
  # under us the way a moving action tag can (supply-chain risk).
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to the repository's Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No build needed: CodeQL analyses Java and TypeScript sources directly (build-mode none).
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: trivy (Dockerfiles and images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A fresh checkout has no node_modules or build output, so the whole repository is quick to scan.
      - name: Scan Dockerfiles and configuration for misconfigurations
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config --quiet --exit-code 1 \
            --severity HIGH,CRITICAL /src

      # The images are built exactly as CD builds them, so what is scanned is what would be deployed.
      - name: Build images
        run: |
          docker build -t shiftgrab-backend:scan backend
          docker build -t shiftgrab-frontend:scan frontend

      # Gate: a CRITICAL vulnerability that already has a fix fails the build (update the base image or the
      # dependency). HIGH ones are reported in the Security tab without blocking.
      - name: Scan images (gate on fixable CRITICAL)
        run: |
          for image in shiftgrab-backend:scan shiftgrab-frontend:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --quiet --ignore-unfixed --exit-code 1 --severity CRITICAL "$image"
          done

      - name: Report HIGH and CRITICAL to the Security tab
        if: always()
        run: |
          mkdir -p sarif
          for name in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              -v "$PWD/sarif:/out" "$TRIVY_IMAGE" image --quiet --ignore-unfixed --severity HIGH,CRITICAL \
              --format sarif --output "/out/$name.sarif" "shiftgrab-$name:scan"
          done

      # One upload per image: code scanning accepts one SARIF run per category.
      - name: Upload Trivy results (backend)
        if: always() && hashFiles('sarif/backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/backend.sarif
          category: trivy-backend

      - name: Upload Trivy results (frontend)
        if: always() && hashFiles('sarif/frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/frontend.sarif
          category: trivy-frontend

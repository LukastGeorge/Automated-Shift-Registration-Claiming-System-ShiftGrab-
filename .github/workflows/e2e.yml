name: E2E

# SG-82: Playwright drives the real production stack (edge nginx, Angular, Keycloak login with PKCE, two backends,
# PostgreSQL, Redis) built from this commit. It takes several minutes, so it runs where it matters most:
#   - every pull request into main (a release), where it is a required check;
#   - a feature pull request labelled "e2e" (add the label when a change deserves it);
#   - nightly on develop, to catch breakage between releases;
#   - on demand (Actions → E2E → Run workflow).
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 19 * * *" # 02:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scheduled runs start from the default branch (main); the nightly check is about develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Build images from this commit
        run: |
          docker build -t e2e/shiftgrab-backend:ci backend
          docker build -t e2e/shiftgrab-frontend:ci frontend

      # Throwaway secrets for a throwaway stack, generated per run and masked in the log.
      - name: Write the stack environment
        run: |
          # Generate first, mask on stdout (where the runner reads ::add-mask::), then write the file.
          for name in db kcdb kcadmin grafana manager staff; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            printf -v "$name" '%s' "$value"
          done
          cat > "$RUNNER_TEMP/e2e.env" <<EOF
          DOMAIN=localhost
          SHIFTGRAB_PUBLIC_URL=http://localhost:8088
          IMAGE_PREFIX=e2e
          SHIFTGRAB_VERSION=ci
          DB_PASSWORD=$db
          KEYCLOAK_DB_PASSWORD=$kcdb
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=$kcadmin
          GRAFANA_ADMIN_PASSWORD=$grafana
          GRAFANA_ANONYMOUS=false
          DEMO_MANAGER_PASSWORD=$manager
          DEMO_STAFF_PASSWORD=$staff
          BACKUP_DIR=backups
          EDGE_HTTP_PORT=8088
          EDGE_HTTPS_PORT=8443
          EOF
          { echo "E2E_MANAGER_PASSWORD=$manager"; echo "E2E_STAFF_PASSWORD=$staff"; } >> "$GITHUB_ENV"

      - name: Start the production stack
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml --env-file "$RUNNER_TEMP/e2e.env" \
            up -d --wait --wait-timeout 300
          # Keycloak reports healthy before its realm import finishes (runbook §4): wait for the realm itself.
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8088/auth/realms/shiftgrab/.well-known/openid-configuration > /dev/null \
              && echo "realm ready" && exit 0
            sleep 3
          done
          echo "realm not ready" && exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
        run: npx playwright test

      - name: Collect container logs
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml --env-file "$RUNNER_TEMP/e2e.env" \
            logs --no-color > e2e/stack.log 2>&1 || true

      # Trace, screenshots and video of a failed run: open the trace with `npx playwright show-trace`.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.prod.yml --env-file "$RUNNER_TEMP/e2e.env" down -v || true

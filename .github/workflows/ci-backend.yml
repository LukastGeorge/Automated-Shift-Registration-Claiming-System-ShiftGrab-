name: CI - Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infra/keycloak/realm-shiftgrab.json" # imported by KeycloakIntegrationTests
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "infra/keycloak/realm-shiftgrab.json"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Unit + integration tests (Testcontainers: PostgreSQL, Keycloak) and the JaCoCo gate
      # (line >= 70%, branch >= 60%), which fails the build when coverage drops.
      - name: Build, test and check coverage
        run: mvn -B clean verify

      - name: Coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              printf "## Backend coverage\n\n| Counter | Covered | Total | Ratio | Gate |\n|---|---|---|---|---|\n"
              printf "| Line | %d | %d | %.1f%% | 70%% |\n", lc, lc + lm, 100 * lc / (lc + lm)
              printf "| Branch | %d | %d | %.1f%% | 60%% |\n", bc, bc + bm, 100 * bc / (bc + bm)
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('backend/target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

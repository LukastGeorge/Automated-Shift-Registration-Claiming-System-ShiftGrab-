version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Angular packages must move together, otherwise the build breaks on mismatched versions.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint"]
      test:
        patterns: ["vitest", "@vitest/*", "jsdom"]
    ignore:
      # The Angular compiler accepts only one TypeScript minor line (peer dependency, e.g. ">=6.0 <6.1"),
      # so TypeScript is upgraded together with Angular via `ng update`, never on its own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  # Base images of the production Dockerfiles (SG-70)
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The runtime JRE must be the Java version the code is compiled and tested with (pom.xml, CI: 21).
      # Moving to the next LTS is a planned upgrade of build, CI and runtime together, not an image bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The build image follows the Node.js range supported by the Angular version and used by CI (24).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Major PostgreSQL upgrades need pg_upgrade or dump/restore and must move together with
      # Testcontainers and production (ADR-0002), so they are planned by hand, not by a bot PR.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Certificate renewal must be tried against a real certificate on the server before a major upgrade
      # (runbook §3); a silent break shows up only when the certificate expires.
      - dependency-name: "certbot/certbot"
        update-types: ["version-update:semver-major"]

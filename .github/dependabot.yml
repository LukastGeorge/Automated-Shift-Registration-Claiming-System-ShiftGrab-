version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Angular packages must move together, otherwise the build breaks on mismatched versions.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint"]
      test:
        patterns: ["vitest", "@vitest/*", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker-compose
    directory: /infra/docker
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Major PostgreSQL upgrades need pg_upgrade or dump/restore and must move together with
      # Testcontainers and production (ADR-0002), so they are planned by hand, not by a bot PR.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

# Security headers for every response of the web app (SG-92). Included in EACH location block, because nginx drops
# all server-level add_header directives in a location that declares its own (before SG-92, index.html silently
# lacked Permissions-Policy for that reason).
#
# Content-Security-Policy, derived from what the app really loads (production stack: one origin behind the edge):
#   script-src 'self'          only the app's own bundles; no inline script (inlineCritical is off in angular.json)
#   style-src  'unsafe-inline' Angular injects component styles as <style> at runtime; styles cannot run code
#   fonts.googleapis/gstatic   Be Vietnam Pro and Material Symbols
#   connect-src 'self'         /api, /ws (same-origin WebSocket) and /auth (Keycloak) all sit behind the edge
#   frame-ancestors 'none'     no clickjacking (the modern X-Frame-Options)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Static web app (SG-70). TLS, /api and /ws are handled by the edge proxy in front of this container (SG-71).
# Every location includes security-headers.conf: an add_header inside a location cancels all inherited ones (SG-92).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration: must never be cached, or a changed setting would not reach browsers.
    location = /config.json {
        include /etc/nginx/shiftgrab/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # File names contain a content hash: safe to cache for a year.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        include /etc/nginx/shiftgrab/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/manage/shifts, ...) all serve index.html, which is never cached.
    location / {
        include /etc/nginx/shiftgrab/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shiftgrab-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shiftgrab}
    username: ${DB_USER:shiftgrab}
    password: ${DB_PASSWORD:shiftgrab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

shiftgrab:
  time-zone: Asia/Ho_Chi_Minh

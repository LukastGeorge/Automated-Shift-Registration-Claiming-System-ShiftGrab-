server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shiftgrab-backend
  datasource:
    # Default port matches infra/docker (5433); production sets DB_HOST/DB_PORT explicitly.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shiftgrab}
    username: ${DB_USER:shiftgrab}
    password: ${DB_PASSWORD:shiftgrab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mail:                       # SG-41. Local: Mailpit from infra/docker (web UI http://localhost:8025)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false      # table created by Flyway (V5)
      # A publication still PUBLISHED/PROCESSING after this long belongs to a dead instance: mark it failed so
      # EventPublicationMaintenance resubmits it.
      staleness:
        published: 5m
        processing: 5m
        resubmitted: 5m
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/shiftgrab}
          audiences: shiftgrab-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

shiftgrab:
  time-zone: Asia/Ho_Chi_Minh
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rules:
    weekly-hour-limit: ${WEEKLY_HOUR_LIMIT:40h}   # BR-04
    cancel-deadline: ${CANCEL_DEADLINE:24h}        # BR-06
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}   # ShedLock-guarded jobs (SG-41 resubmission, SG-42 reminders)
  notification:
    enabled: ${NOTIFICATION_ENABLED:true}
    from: ${MAIL_FROM:ShiftGrab <no-reply@shiftgrab.local>}
    app-url: ${APP_URL:http://localhost:4200}
  lock:                       # ADR-0004
    provider: ${LOCK_PROVIDER:redis}          # redis | in-memory (single instance only)
    redis-address: ${REDIS_ADDRESS:redis://localhost:6379}
    wait-time: 3s
    lease-time: 10s

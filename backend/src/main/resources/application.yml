server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shiftgrab-backend
  datasource:
    # Default port matches infra/docker (5433); production sets DB_HOST/DB_PORT explicitly.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shiftgrab}
    username: ${DB_USER:shiftgrab}
    password: ${DB_PASSWORD:shiftgrab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/shiftgrab}
          audiences: shiftgrab-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

shiftgrab:
  time-zone: Asia/Ho_Chi_Minh
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rules:
    weekly-hour-limit: ${WEEKLY_HOUR_LIMIT:40h}   # BR-04
    cancel-deadline: ${CANCEL_DEADLINE:24h}        # BR-06
  lock:                       # ADR-0004
    provider: ${LOCK_PROVIDER:redis}          # redis | in-memory (single instance only)
    redis-address: ${REDIS_ADDRESS:redis://localhost:6379}
    wait-time: 3s
    lease-time: 10s
